function importStudentsFromExcel(f){if(!f||!checkPermission('addStudents'))return;const r=new FileReader();r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'});const items=[];let hasG=false;
wb.SheetNames.forEach(sn=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});if(!rows.length)return;let hi=rows.findIndex(r=>r.some(c=>/name|اسم|student|الطالب/i.test(String(c))));let H=hi>=0?rows[hi].map(c=>String(c).trim()):[];
const ix=re=>H.findIndex(h=>re.test(h));let cn=ix(/name|اسم|student|الطالب/i),cc=ix(/^class|^الصف|فصل/i),cg=ix(/^grade/i),cs=ix(/section|شعبة/i),cx=ix(/gender|الجنس|النوع/i);if(hi<0){hi=-1;cn=0}
if(cx>=0)hasG=true;const sheetCls=nn(sn);
rows.slice(hi+1).forEach(r=>{const name=nn(r[cn]??'');if(!name)return;let c=cc>=0?nn(r[cc]).replace(/\s*[-/]\s*/,'-'):cg>=0&&cs>=0?nn(r[cg])+'-'+nn(r[cs]):sheetCls.replace(/\s*[-/]\s*/,'-');items.push({name,c,boy:cx<0||/^(boy|male|ذكر|بنين)/i.test(nn(r[cx]))})})});
IMP={items};previewImport(hasG)};r.readAsArrayBuffer(f)}
function previewImport(hasG){const only=hasG&&$('bo')?$('bo').checked:hasG;const names=new Set(DB.classes.map(c=>c.name));const by={};let sk=0;

const rows=DB.classes.filter(c=>by[c.name]).map(c=>{const ex=new Set(DB.students.filter(s=>s.classId===c.name).map(s=>nn(s.ar||s.en).toLowerCase()));const u=[...new Set(by[c.name].map(x=>x.toLowerCase()))];const d=rep?0:u.filter(x=>ex.has(x)).length;return`<tr><td>${c.name}</td><td>${u.length-d}</td><td>${d}</td></tr>`}).join('');
modal(`<h3 style="font-weight:700;margin-bottom:8px">${t('imp')} — ${t('preview')}</h3>${hasG?`<label style="display:block"><input id="bo" type="checkbox" ${only?'checked':''} onchange="previewImport(true)"> ${t('boysonly')}</label>`:''}<label style="display:block;margin-bottom:8px"><input id="rp_" type="checkbox" ${rep?'checked':''} onchange="previewImport(${hasG})"> ${t('replace')}</label><div class="tw"><table class="t"><thead><tr><th>${t('class')}</th><th>${t('newst')}</th><th>${t('dups')}</th></tr></thead><tbody>${rows||`<tr><td colspan="3">${t('exc')}</td></tr>`}</tbody></table></div><p style="margin:8px 0">${t('skipped')}: ${sk}</p><button class="btn" onclick="confirmImport()">${t('confirm')}</button> <button class="btn s" onclick="closeModal()">${t('cancel')}</button>`)}

function beep(f=700,d=.08){try{const c=AC(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}

function initWheel(){drawWheel();showTime()}
function drawWheel(){const cv=$('wh');if(!cv)return;const x=cv.getContext('2d'),L=stu(),n=L.length,r=150,cs=['#23479f','#c8962e','#1f9d63','#d64545','#7b4fc9','#2a9bb5'];x.clearRect(0,0,320,320);
L.forEach((s,i)=>{const a0=W.a+i*2*Math.PI/n,a1=a0+2*Math.PI/n;x.beginPath();x.moveTo(160,160);x.arc(160,160,r,a0,a1);x.fillStyle=cs[i%cs.length];x.fill();x.save();x.translate(160,160);x.rotate((a0+a1)/2);x.fillStyle='#fff';x.font=(n>25?'8':'11')+'px Cairo';x.textAlign='right';x.fillText(loc(s).split(' ').slice(0,2).join(' '),r-8,3);x.restore()});
x.beginPath();x.moveTo(150,2);x.lineTo(170,2);x.lineTo(160,26);x.fillStyle='#14213d';x.fill()}
function spinWheel(){if(W.spin)return;const L=stu();if(!L.length)return;W.spin=true;let v=.3+Math.random()*.25,last=-1;$('wn').textContent='';
(function f(){W.a+=v;v*=.985;const n=L.length,seg=Math.floor((((-Math.PI/2-W.a)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/(2*Math.PI/n));if(seg!==last){beep(500+seg%5*60,.03);last=seg}drawWheel();
if(v>.002)requestAnimationFrame(f);else{W.spin=false;W.win=loc(L[seg]);beep(880,.4);render()}})()}
function showTime(){const e=$('td');if(e)e.textContent=String(Math.floor(TM.left/60)).padStart(2,'0')+':'+String(TM.left%60).padStart(2,'0')}
function tick(){TM.h=setInterval(()=>{TM.left--;showTime();if(TM.left<=0){clearInterval(TM.h);TM.run=false;TM.left=0;showTime();const m=$('tmsg');if(m)m.textContent=t('timeup');[0,.3,.6].forEach(d=>setTimeout(()=>beep(900,.25),d*1000))}},1000)}
function startTimer(){clearInterval(TM.h);TM.left=(+$('tmn').value||0)*60+(+$('tsc').value||0);if(TM.left<=0)return;$('tmsg').textContent='';showTime();TM.run=true;tick()}
function pauseTimer(){clearInterval(TM.h);TM.run=false}
function resumeTimer(){if(!TM.run&&TM.left>0){TM.run=true;tick()}}
function resetTimer(){clearInterval(TM.h);TM.run=false;TM.left=0;showTime();const m=$('tmsg');if(m)m.textContent=''}

/* ACL uses Firebase Auth UID, never an email-derived database key. */
async function cloudAclSetup(){
const fu=firebase.auth().currentUser;if(!fu)throw new Error('Authentication required');
const em=(fu.email||'').toLowerCase(),creator=em===CREATOR.toLowerCase();
let me=DB.users.find(u=>u.email&&u.email.toLowerCase()===em&&!u.disabled);
/* The configured creator is provisioned automatically on first cloud sign-in. */
if(!me&&creator){
  me={id:'creator_'+fu.uid,name:'محمد',email:em,role:'creator',perms:PERMS.slice(),classes:[],subjects:[],disabled:false};
  DB.users.push(me);
}
if(!me)throw new Error('Account is not enabled for this app');
if(creator){me.role='creator';me.disabled=false;me.perms=PERMS.slice();}
let mineSnap=await CL.ref.child('acl/'+fu.uid).once('value');
if(creator){
  await CL.ref.child('acl/'+fu.uid).set({role:'creator',active:true,classes:[],subjects:[]});
}else if(!mineSnap.exists()){
  throw new Error('Account UID is not provisioned in classroom/acl');
}
const aclValue=(await CL.ref.child('acl/'+fu.uid).once('value')).val();
const role=typeof aclValue==='string'?aclValue:(aclValue&&aclValue.role)||'';
if(!aclValue||aclValue.active===false||role!==me.role||!['creator','admin','member'].includes(role))throw new Error('Account role is not authorized');
me.uid=fu.uid;me.fb=true;
const raw=JSON.stringify(me),p='users/'+kenc(me.id);CL.snap[p]=raw;await CL.ref.child(p).set(raw);
if(role==='creator'||role==='admin'){
  CL.acl=(await CL.ref.child('acl').once('value')).val()||{};
  CL.aclPrev=new Set(Object.keys(CL.acl));
}else{CL.acl={[fu.uid]:aclValue};CL.aclPrev=new Set([fu.uid]);}
saveLocal();}
